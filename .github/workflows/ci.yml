name: CI

# PO CO: przez dwa miesiące suita e2e miała 50 czerwonych ze 133 i nikt tego nie widział,
# bo nikt jej nie puszczał w całości. Panel podatkowy zniknął z produktu, a testy to
# zgłaszały (ADR-013). Test migracji `guests`→`adults` zgnił po sześciu dniach bezgłośnie
# ([[Known-Issues]] #14). Deklaracja „e2e N/N" w commicie starzeje się tego samego dnia —
# tutaj jest odnawiana przy każdym pushu.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sprawdzenie:
    name: lint · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build produkcyjny
        run: npm run build

      # Sam Chromium — projekty w playwright.config.js i tak używają tylko jego.
      - name: Przeglądarka dla testów
        run: npx playwright install --with-deps chromium

      # Firebase jest w tych testach zamockowany (e2e/firebase-mock.js), więc nie
      # potrzebują sekretów ani dostępu do produkcji. Stan produkcji pilnuje osobny
      # przepływ: prod-smoke.yml.
      - name: Testy e2e
        run: npx playwright test

      - name: Raport z nieudanego przebiegu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
